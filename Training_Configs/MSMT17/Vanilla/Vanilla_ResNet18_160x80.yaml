EXPERIMENT:
  CUDA_AMP: true
OUTPUT_DIR:
  ROOT_PATH: ./outputs/Vanilla
  EXPERIMENT_NAME: MSMT17_ResNet18_160x80
DATASETS:
  NAMES: MSMT17
  ROOT_DIR: ./data
DISTILLER:
  TYPE: NONE
  STUDENT_NAME: ResNet18
  STUDENT_PRETRAIN_PATH: ''
INPUT:
  STUDENT_SIZE_TRAIN:
  - 160
  - 80
  STUDENT_SIZE_TEST:
  - 160
  - 80
  STUDENT_PADDING: 4
  RE_PROB: 0.5
DATALOADER:
  NUM_WORKERS: 8
  NUM_INSTANCE: 6
SOLVER:
  TRAINER: vanilla
  IMS_PER_BATCH: 96
  MAX_EPOCHS: 120
  BASE_LR: 0.01
  LR_DECAY_TYPE: WarmupCosineAnnealingLR
  LR_WARMUP_EPOCHS: 10
  LR_WARMUP_FACTOR: 0.1
  LR_DECAY_STEPS:
  - 40
  OPTIMIZER_NAME: SGD
  CHECKPOINT_PERIOD: 120
TEST:
  IMS_PER_BATCH: 512
  WEIGHT: 120

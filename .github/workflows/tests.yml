name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU PyTorch and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run tests with the Python evaluator
        run: python -m unittest discover -s tests -v
      - name: Build optional native evaluator
        run: |
          python -m pip install -r requirements-optional.txt
          cd AIR_Distiller/utils/rank_cylib
          python setup.py build_ext --inplace
      - name: Test runtime with native evaluation
        run: python -m unittest discover -s tests -p test_release_runtime.py -v
